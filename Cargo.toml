[package]
name = "punto-rs"
version = "0.1.0"
edition = "2021"
description = "Keyboard layout corrector daemon for Linux — retypes mistyped text in the right layout (Punto Switcher alternative)"
license = "MIT"
repository = "https://github.com/netherguy4/punto-rs"
readme = "README.md"
keywords = ["keyboard", "layout", "evdev", "uinput", "linux"]
categories = ["command-line-utilities"]

[dependencies]
evdev = "0.12"

[profile.release]
opt-level = "s"
lto = true
strip = true
