# Конфиг punto-rs. Формат: ключ=значение, всё после # — комментарий.
# Скан-коды можно подсмотреть в `sudo showkey` или в input-event-codes.h.

# Комбинации исправления раскладки: имена или скан-коды через +.
# Имена: insert, pause, scrolllock, capslock, menu, rightctrl, f1..f12 и т.д.
hotkey=insert
phrase-hotkey=super+insert

# Комбинация, которой раскладка переключается в самой системе.
# super+space (оно же 125+57) — значение GNOME по умолчанию.
layout-switch=super+space

# Пауза между отдельными нажатиями при переигрывании, мс.
key-delay=6

# Пауза после стирания слова, перед переключением раскладки, мс.
post-backspace-delay=20

# Пауза после переключения раскладки, мс. GNOME применяет её не мгновенно;
# если первые буквы выходят в старой раскладке — увеличьте.
switch-delay=120

# Клавиатуры по именам через запятую. Пусто — определять автоматически.
# Список имён: punto-rs --list-devices
devices=

# Предел буфера набранного, в нажатиях.
max-strokes=512

# Следить за кнопками мыши: клик переставляет курсор ввода, поэтому буфер
# сбрасывается. Выключите, если демон не должен открывать устройства-указатели.
track-mouse=yes

# Приостановить/возобновить накопление и коррекцию, очистив буфер.
pause-hotkey=super+pause

# Разрешать коррекцию только в разблокированной графической сессии seat0.
# Нужны systemd-logind и доступ к системной D-Bus; при ошибке ввод запрещён.
session-guard=yes

# Сброс после простоя, мс (1000..300000).
buffer-timeout=30000
