# Конфиг punto-rs. Формат: ключ=значение, всё после # — комментарий.
# Скан-коды можно подсмотреть в `sudo showkey` или в input-event-codes.h.

# Клавиша исправления раскладки.
# Одиночное нажатие правит последнее слово, Shift+клавиша — всю фразу.
# 110 = Insert, 119 = Pause/Break, 97 = правый Ctrl, 70 = Scroll Lock.
hotkey=110

# Комбинация, которой раскладка переключается в самой системе.
# 125+57 = Super+Space (значение GNOME по умолчанию).
layout-switch=125+57

# Пауза между отдельными нажатиями при переигрывании, мс.
key-delay=6

# Пауза после стирания слова, перед переключением раскладки, мс.
post-backspace-delay=20

# Пауза после переключения раскладки, мс. GNOME применяет её не мгновенно;
# если первые буквы выходят в старой раскладке — увеличьте.
switch-delay=120

# Клавиатуры по именам через запятую. Пусто — определять автоматически.
# Список имён: punto-rs --list-devices
devices=

# Предел буфера набранного, в нажатиях.
max-strokes=512
